<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daiku</title>
    <!-- Inline, so the window paints its background before any of the app has loaded. No logo: the greeting comes first. App.tsx removes it. -->
    <style>
      html { background: #fbfaf7; }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fbfaf7;
        color: #4e6450;
        pointer-events: none;
        transition: opacity 260ms ease;
      }
      #splash.gone { opacity: 0; }
      @media (prefers-color-scheme: dark) {
        html, #splash { background: #151513; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash { transition: none; }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <div id="splash" aria-hidden="true">
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
