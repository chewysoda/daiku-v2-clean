[package]
name = "daiku"
version = "0.1.0"
description = "Daiku: a local-first visual research and engineering workspace"
authors = ["k1mchi"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "daiku_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "gzip"] }
sha2 = "0.11.1"
url = "2.5.8"
tokio = { version = "1.54.1", features = ["net"] }
futures-util = "0.3.34"
tauri-plugin-clipboard-manager = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# The snip tool's screenshot of the browser pane. These match the versions Tauri already uses.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_System_Registry", "Foundation", "Foundation_Collections", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "UI_Input_Inking"] }
windows-collections = "0.3"

# Installed but deliberately not registered in lib.rs yet: it needs a signing key and an
# endpoint in tauri.conf.json before it can run.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
